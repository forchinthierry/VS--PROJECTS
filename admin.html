<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="logo.png">
  <title>Admin Dashboard - G-Spirit Loan Solution</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --navy: #1f2b5d;
      --navy-deep: #18274d;
      --teal: #0b88a4;
      --teal-soft: #e8f7fb;
      --gold: #d48a00;
      --gold-soft: #fff4dc;
      --ink: #1d2433;
      --muted: #5d697c;
      --line: #e6ebf3;
      --paper: #ffffff;
      --page: #f7f9fc;
      --danger: #d64545;
      --success: #1b9c73;
      --shadow: 0 16px 38px rgba(23, 43, 79, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #f6f8fc 0%, #eef3f9 100%);
      color: var(--ink);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, var(--navy-deep), var(--navy));
      color: white;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 10px 22px rgba(24, 39, 77, 0.15);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 0.02em;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(11,136,164,0.2), rgba(212,138,0,0.25));
      border: 1px solid rgba(255,255,255,0.25);
      font-size: 18px;
    }

    .container {
      width: min(1280px, 96%);
      margin: 24px auto 40px;
      padding: 0 10px;
    }

    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(circle at top left, rgba(11,136,164,0.10), transparent 28%),
        radial-gradient(circle at bottom right, rgba(212,138,0,0.12), transparent 25%),
        var(--page);
    }

    .login-card {
      width: min(440px, 100%);
      background: rgba(255,255,255,0.98);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 26px 24px;
      box-shadow: var(--shadow);
      text-align: left;
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      color: var(--navy-deep);
    }

    .login-brand .brand-mark {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--teal), #4bb4cd);
      border: none;
      color: white;
      font-size: 20px;
    }

    .login-brand strong {
      display: block;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
    }

    .login-brand small {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .login-card h2 {
      margin: 0 0 8px;
      color: var(--navy-deep);
      font-size: 2rem;
      line-height: 1.2;
    }

    .login-subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .field-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 7px;
      color: var(--navy-deep);
    }

    .login-card input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccd5e3;
      border-radius: 10px;
      font-size: 14px;
      background: #fbfcff;
      color: var(--ink);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .login-card input:focus {
      border-color: rgba(11, 136, 164, 0.8);
      box-shadow: 0 0 0 4px rgba(11,136,164,0.10);
      outline: none;
    }

    .login-card button,
    .toolbar button,
    .nav-btn,
    .refresh-btn,
    .tab-btn,
    .whatsapp-btn,
    .agreement-btn {
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }

    .login-card button {
      width: 100%;
      background: linear-gradient(135deg, var(--teal), #1eaac0);
      color: white;
      border: none;
      padding: 13px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 12px 22px rgba(11, 136, 164, 0.18);
    }

    .login-card button:hover,
    .toolbar button:hover,
    .nav-btn:hover,
    .refresh-btn:hover,
    .tab-btn:hover,
    .whatsapp-btn:hover,
    .agreement-btn:hover {
      transform: translateY(-1px);
    }


    .login-card button:disabled {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    .login-error {
      color: var(--danger);
      font-size: 0.82rem;
      margin-top: 12px;
      min-height: 18px;
      display: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .sidebar-toggle {
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      background: rgba(255,255,255,0.08);
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      font-weight: 700;
    }

    .nav-btn,
    .refresh-btn {
      border: none;
      color: white;
      background: linear-gradient(135deg, #2f7fe8, #4d8ae0);
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 12px 22px rgba(47, 127, 232, 0.18);
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(23, 43, 79, 0.05);
      overflow: hidden;
    }

    .dashboard-shell {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      margin-top: 18px;
    }

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #ffffff 0%, #f7f9ff 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(23, 43, 79, 0.06);
      padding: 16px 12px;
      position: sticky;
      top: 88px;
      transition: width 0.22s ease, opacity 0.18s ease, padding 0.22s ease, border 0.22s ease, transform 0.22s ease;
      overflow: hidden;
      opacity: 1;
    }

    .sidebar.collapsed {
      width: 0;
      min-width: 0;
      padding: 0;
      border-width: 0;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-12px);
    }

    .sidebar-title {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin: 4px 10px 12px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(31,43,93,0.08);
      background: rgba(255,255,255,0.7);
      color: var(--navy-deep);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      text-align: left;
      font-size: 0.8rem;
      font-weight: 700;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .nav-item:hover {
      transform: translateY(-1px);
    }

    .nav-item.active {
      background: linear-gradient(135deg, var(--navy), var(--navy-deep));
      color: white;
      border-color: transparent;
      box-shadow: 0 10px 18px rgba(31,43,93,0.14);
    }

    .nav-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(11,136,164,0.10);
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .nav-item.active .nav-icon {
      background: rgba(255,255,255,0.12);
    }

    .nav-copy {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .nav-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(11,136,164,0.12);
      color: var(--navy-deep);
      font-size: 0.72rem;
      font-weight: 800;
    }

    .nav-item.active .nav-count {
      background: rgba(255,255,255,0.15);
      color: white;
    }

    .main-panel {
      flex: 1;
      min-width: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }

    .toolbar input {
      flex: 1;
      min-width: 220px;
      border: 1px solid #ccd5e3;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      background: #fbfcff;
      color: var(--ink);
    }

    .toolbar button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      min-width: 126px;
      font-weight: 700;
    }

    .delete-btn {
      background: linear-gradient(135deg, #eb5d5d, #d24444);
      color: white;
    }

    .results-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-left: auto;
    }

    .table-wrap { overflow-x: auto; max-height: 70vh; overflow-y: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.7px;
      min-width: 1100px;
    }

    th {
      background: linear-gradient(135deg, var(--navy), var(--navy-deep));
      color: white;
      text-align: left;
      padding: 12px 10px;
      position: sticky;
      top: 0;
      z-index: 1;
      font-size: 12px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      color: var(--ink);
      background: white;
    }

    tr:hover td {
      background: #fafcff;
    }

    select.status-select {
      padding: 7px 8px;
      border: 1px solid #d2dceb;
      border-radius: 8px;
      background: #f9fbfe;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 600;
      min-width: 108px;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    select.status-select.status-new {
      background: #f9fbfe;
      color: var(--ink);
      border-color: #d2dceb;
    }

    select.status-select.status-under-review {
      background: #fff4e0;
      color: #8a5a00;
      border-color: #f0b955;
    }

    select.status-select.status-approved {
      background: #e3f8ee;
      color: #0f6d3f;
      border-color: #4cc890;
    }

    select.status-select.status-rejected {
      background: #fdeaea;
      color: #a52020;
      border-color: #e87e7e;
    }

    select.status-select.status-disbursed {
      background: #e6efff;
      color: #1c3fa0;
      border-color: #7ca0f0;
    }

    /* option text always stays plain/dark so the dropdown list itself remains readable */
    select.status-select option {
      background: #fff;
      color: #222;
    }

    .status-New { background-color: #e8f0ff; color: var(--navy); font-weight: 700; padding: 6px 10px; border-radius: 6px; display: inline-block; }
    .status-UnderReview { background-color: #fff3e0; color: #e65100; font-weight: 700; padding: 6px 10px; border-radius: 6px; display: inline-block; }
    .status-Approved { background-color: #4caf50; color: white; font-weight: 700; padding: 6px 10px; border-radius: 6px; display: inline-block; }
    .status-Rejected { background-color: #f44336; color: white; font-weight: 700; padding: 6px 10px; border-radius: 6px; display: inline-block; }
    .status-Disbursed { background-color: #2196f3; color: white; font-weight: 700; padding: 6px 10px; border-radius: 6px; display: inline-block; }

    .whatsapp-btn {
      background: linear-gradient(135deg, #22c767, #1da859);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      margin-left: 4px;
      box-shadow: 0 8px 18px rgba(34,199,103,0.18);
    }

    .agreement-btn {
      background: linear-gradient(135deg, #2576ef, #3d79d7);
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      margin-top: 6px;
      display: inline-block;
      text-align: center;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(37,118,239,0.18);
    }

    .empty-state {
      padding: 52px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.98rem;
      background: linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
    }

    @media (max-width: 640px) {
      header {
        padding: 16px 18px;
      }

      header h1 {
        font-size: 1rem;
      }

      .login-card {
        padding: 22px 18px 20px;
      }

      .toolbar {
        align-items: stretch;
      }

      .results-count {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

  <div id="loginScreen" class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">G</div>
        <div>
          <strong>G-SPIRIT</strong>
          <small>Admin access</small>
        </div>
      </div>
      <h2>Admin Login</h2>
      <p class="login-subtitle">Enter the secure admin password to access application records.</p>
      <div class="field-group">
        <label for="tokenInput">Password</label>
        <input type="password" id="tokenInput" placeholder="Enter admin password" autocomplete="current-password">
      </div>
      <button onclick="login()">Log In</button>
      <div class="login-error" id="loginError">Incorrect password or connection failed.</div>
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    <header>
      <div class="brand-lockup">
        <div class="brand-mark">G</div>
        <span>G-Spirit Admin Dashboard</span>
      </div>
      <div class="header-actions">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu" aria-expanded="true" onclick="toggleSidebar()">☰</button>
        <button class="refresh-btn" onclick="loadCurrentTab()">Refresh</button>
        <button class="nav-btn" onclick="logout()">Log Out</button>
      </div>
    </header>

    <div class="container">
      <div class="dashboard-shell">
        <aside class="sidebar" id="sidebarMenu">
          <div class="sidebar-title">Application Center</div>

          <div class="nav-list">
            <button class="nav-item active" data-tab="loans">
              <span class="nav-icon">💰</span>
              <span class="nav-copy">
                <span class="nav-label">Loan Apps</span>
                <span class="nav-count" id="count-loans">0</span>
              </span>
            </button>

            <button class="nav-item" data-tab="partners">
              <span class="nav-icon">🤝</span>
              <span class="nav-copy">
                <span class="nav-label">Partnership</span>
                <span class="nav-count" id="count-partners">0</span>
              </span>
            </button>

            <button class="nav-item" data-tab="capital">
              <span class="nav-icon">📈</span>
              <span class="nav-copy">
                <span class="nav-label">Capital</span>
                <span class="nav-count" id="count-capital">0</span>
              </span>
            </button>
          </div>
        </aside>

        <main class="main-panel">
          <div class="toolbar">
            <input id="searchInput" type="text" placeholder="Search by name, phone, amount or date..." oninput="applySearch()">
            <button class="delete-btn" onclick="toggleSelectAll()">Select Visible</button>
            <button class="delete-btn" onclick="deleteSelected()">Delete Selected</button>
            <button class="delete-btn" onclick="deleteAll()">Delete All</button>
            <div id="resultsCount" class="results-count">0 results</div>
          </div>

          <div class="card">
            <div class="table-wrap" id="tableWrap">
              <div class="empty-state">Loading...</div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <script>
  var API_BASE = 'https://gspiritloans-api.forchinthierry.workers.dev';
    var currentTab = 'loans';
    var adminToken = '';
    var currentData = [];
    var currentFiltered = [];
    var selectedIds = {};

    async function login() {
      var password = document.getElementById('tokenInput').value.trim();
      var errorEl = document.getElementById('loginError');
      var button = document.querySelector('#loginScreen .login-card button');

      if (!password) {
        errorEl.textContent = 'Please enter your admin password.';
        errorEl.style.display = 'block';
        return;
      }

      errorEl.style.display = 'none';
      if (button) {
        button.disabled = true;
        button.textContent = 'Logging in...';
      }

      try {
        var res = await fetch(API_BASE + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password })
        });

        var data = await res.json();

        if (!res.ok || !data.success || !data.token) {
          throw new Error(data.error || 'Login failed.');
        }

        adminToken = data.token;
        sessionStorage.setItem('gspirit_admin_token', data.token);

        document.getElementById('tokenInput').value = '';
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadCurrentTab();
      } catch (err) {
        errorEl.textContent =
          err && err.message ? err.message : 'Incorrect password or connection failed.';
        errorEl.style.display = 'block';
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent = 'Log In';
        }
      }
    }

    function syncSidebarState() {
      document.querySelectorAll('.nav-item').forEach(function (item) {
        item.classList.toggle('active', item.dataset.tab === currentTab);
      });
    }

    function updateSidebarCounts(counts) {
      var countMap = counts || { loans: 0, partners: 0, capital: 0 };
      var ids = {
        loans: 'count-loans',
        partners: 'count-partners',
        capital: 'count-capital'
      };

      Object.keys(ids).forEach(function (key) {
        var el = document.getElementById(ids[key]);
        if (el) {
          el.textContent = countMap[key] || 0;
        }
      });
    }

    function fetchTabCount(endpoint) {
      return fetch(API_BASE + endpoint, {
        headers: { 'Authorization': 'Bearer ' + adminToken }
      })
        .then(function (res) {
          if (res.status === 401) throw new Error('unauthorized');
          return res.json();
        })
        .then(function (data) {
          return Array.isArray(data) ? data.length : 0;
        });
    }

    async function loadSidebarCounts() {
      if (!adminToken) {
        updateSidebarCounts({ loans: 0, partners: 0, capital: 0 });
        return;
      }

      try {
        var counts = await Promise.all([
          fetchTabCount('/api/admin/applications'),
          fetchTabCount('/api/admin/partnerships'),
          fetchTabCount('/api/admin/capital')
        ]);

        updateSidebarCounts({
          loans: counts[0],
          partners: counts[1],
          capital: counts[2]
        });
      } catch (err) {
        if (err && err.message === 'unauthorized') {
          updateSidebarCounts({ loans: 0, partners: 0, capital: 0 });
          return;
        }
        console.error('Failed to load sidebar counts:', err);
      }
    }

    function toggleSidebar(forceOpen) {
      var sidebar = document.querySelector('.sidebar');
      var toggle = document.getElementById('sidebarToggle');
      if (!sidebar || !toggle) return;

      var shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : sidebar.classList.contains('collapsed');
      sidebar.classList.toggle('collapsed', !shouldOpen);
      toggle.setAttribute('aria-expanded', String(shouldOpen));
      toggle.textContent = '☰';
    }

    function switchTab(tab) {
      currentTab = tab;
      syncSidebarState();
      toggleSidebar(false);
      loadCurrentTab();
    }

    function attachSidebarListeners() {
      document.querySelectorAll('.nav-item').forEach(function (item) {
        item.addEventListener('click', function () {
          switchTab(item.dataset.tab);
        });
      });
    }

    function loadCurrentTab() {
      var endpoint = currentTab === 'loans'
        ? '/api/admin/applications'
        : currentTab === 'partners'
          ? '/api/admin/partnerships'
          : '/api/admin/capital';
      document.getElementById('tableWrap').innerHTML = '<div class="empty-state">Loading...</div>';

      fetch(API_BASE + endpoint, {
        headers: { 'Authorization': 'Bearer ' + adminToken }
      })
        .then(function (res) {
          if (res.status === 401) throw new Error('unauthorized');
          return res.json();
        })
        .then(function (data) {
          currentData = data || [];
          renderCurrentView();
          loadSidebarCounts();
        })
        .catch(function (err) {
          if (err.message === 'unauthorized') {
            alert('Session expired or wrong password. Please log in again.');
            logout();
          } else {
            document.getElementById('tableWrap').innerHTML = '<div class="empty-state">Could not load data. Check the API_BASE URL in this file.</div>';
          }
        });
    }

    function logout() {
      adminToken = '';
      updateSidebarCounts({ loans: 0, partners: 0, capital: 0 });
      sessionStorage.removeItem('gspirit_admin_token');
      document.getElementById('tokenInput').value = '';
      document.getElementById('loginError').style.display = 'none';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'grid';
      document.getElementById('tokenInput').focus();
    }

    function statusOptions(current) {
      var statuses = ['New', 'Under Review', 'Approved', 'Rejected', 'Disbursed'];
      return statuses.map(function (s) {
        return '<option value="' + s + '"' + (s === current ? ' selected' : '') + '>' + s + '</option>';
      }).join('');
    }

    function statusClass(status) {
      var slug = (status || 'New').toString().trim().toLowerCase().replace(/\s+/g, '-');
      var known = ['new', 'under-review', 'approved', 'rejected', 'disbursed'];
      return 'status-' + (known.indexOf(slug) !== -1 ? slug : 'new');
    }

    function updateStatus(table, id, selectEl) {
      var newStatus = selectEl.value;
      fetch(API_BASE + '/api/admin/update-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminToken },
        body: JSON.stringify({ table: table, id: id, status: newStatus })
      })
      .then(function (res) {
        return res.json().then(function (data) {
          if (!res.ok) {
            throw new Error(data.error || 'Status update failed');
          }
          if (!data.success) {
            throw new Error(data.error || 'Status update failed');
          }
          return data;
        });
      })
      .then(function () {
        var row = currentData.find(function (item) { return item.id === id; });
        if (row) {
          row.status = newStatus;
        }
        renderCurrentView();
      })
      .catch(function () {
        alert('Failed to update status. Try again.');
      });
    }

    function normalizeSearchText(value) {
      return (value === null || typeof value === 'undefined' ? '' : String(value)).trim().toLowerCase();
    }

    function rowMatchesSearch(row, searchValue) {
      if (!searchValue) return true;

      var searchableFields = [
        row.name,
        row.phone,
        row.email,
        row.amount,
        row.total_contribution,
        row.created_at,
        row.dob,
        row.surety_name,
        row.surety_phone,
        row.residence,
        row.surety_address,
        row.business_name,
        row.business_stage,
        row.sector,
        row.location,
        row.business_description,
        row.capital_requested,
        row.equity_offered,
        row.registration_status
      ];

      return searchableFields.some(function (field) {
        return normalizeSearchText(field).indexOf(searchValue) !== -1;
      });
    }

    function applySearch() {
      renderCurrentView();
    }

    function renderCurrentView() {
      var searchValue = normalizeSearchText(document.getElementById('searchInput').value);
      currentFiltered = currentData.filter(function (row) {
        return rowMatchesSearch(row, searchValue);
      });
      updateResultsCount();
      if (currentTab === 'loans') renderLoans(currentFiltered);
      else if (currentTab === 'partners') renderPartners(currentFiltered);
      else renderCapital(currentFiltered);
    }

    function updateResultsCount() {
      var selectedCount = Object.keys(selectedIds).length;
      var countText = currentFiltered.length + ' result' + (currentFiltered.length === 1 ? '' : 's');
      if (selectedCount > 0) {
        countText += ' · ' + selectedCount + ' selected';
      }
      document.getElementById('resultsCount').textContent = countText;
    }

    function toggleSelectAll(checked) {
      if (typeof checked === 'boolean') {
        currentFiltered.forEach(function (row) {
          if (checked) selectedIds[row.id] = true;
          else delete selectedIds[row.id];
        });
      } else {
        var anyUnselected = currentFiltered.some(function (row) { return !selectedIds[row.id]; });
        currentFiltered.forEach(function (row) {
          if (anyUnselected) selectedIds[row.id] = true;
          else delete selectedIds[row.id];
        });
      }
      renderCurrentView();
    }

    function toggleSelection(checkbox, id) {
      if (checkbox.checked) selectedIds[id] = true;
      else delete selectedIds[id];
      updateResultsCount();
    }

    function deleteSelected() {
      var ids = Object.keys(selectedIds).map(function (id) { return Number(id); });
      if (ids.length === 0) {
        alert('Select at least one application first.');
        return;
      }
      if (!confirm('Delete the selected application(s)? This cannot be undone.')) return;
      deleteApplications(ids);
    }

    function deleteAll() {
      if (!confirm('Delete all applications in this tab? This cannot be undone.')) return;
      deleteApplications([], true);
    }

    function deleteApplications(ids, all) {
      var table = currentTab === 'loans'
        ? 'loan_applications'
        : currentTab === 'partners'
          ? 'partnership_applications'
          : 'capital_applications';
      fetch(API_BASE + '/api/admin/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminToken },
        body: JSON.stringify({ table: table, ids: ids, all: Boolean(all) })
      })
      .then(function (res) {
        return res.json().then(function (data) {
          if (!res.ok) {
            throw new Error(data.error || 'Delete failed');
          }
          return data;
        });
      })
      .then(function (data) {
        if (!data.success) {
          throw new Error(data.error || 'Delete failed');
        }
        selectedIds = {};
        document.getElementById('searchInput').value = '';
        loadCurrentTab();
      })
      .catch(function (err) {
        alert('Unable to delete applications: ' + err.message);
        console.error('Delete failed:', err);
      });
    }

    function normalizeStatus(status) {
      return (status || '').toString().trim().replace(/\s+/g, ' ').toLowerCase();
    }

    function getWhatsAppTemplate(type, status, row) {
      var amountText = Number(row.amount || row.total_contribution || row.capital_requested || 0).toLocaleString();
      var name = row.name || 'Customer';
      var businessName = row.business_name || 'your business';
      var normalizedStatus = normalizeStatus(status);

      var templates = {
        loan: {
          'new': 'Hello {{1}}, your loan application has been received and is pending review. We\'ll update you here as soon as a decision is made.',
          'under review': 'Hello {{1}}, your loan application with G-Spirit Loan Solution is now under review. We\'ll update you here as soon as a decision is made.',
          'approved': 'Hello {{1}}, good news — your loan application for {{2}} XAF has been approved. Our team will reach out shortly with next steps.',
          'rejected': 'Hello {{1}}, thank you for applying to G-Spirit Loan Solution. We\'re unable to approve this application at this time. Message us on WhatsApp if you\'d like to know more.',
          'disbursed': 'Hello {{1}}, your loan of {{2}} XAF has been disbursed. Repayment begins as agreed in your loan agreement. Thank you for choosing G-Spirit Loan Solution.'
        },
        partner: {
          'new': 'Hello {{1}}, your partnership application has been received and is pending review. We\'ll update you here as soon as a decision is made.',
          'under review': 'Hello {{1}}, thank you for your interest in partnering with G-Spirit Loan Solution. Your application is now under review.',
          'approved': 'Hello {{1}}, congratulations — your partnership application has been approved. We\'ll be in touch shortly to finalize your Growth Share agreement.',
          'rejected': 'Hello {{1}}, thank you for your interest in partnering with G-Spirit Loan Solution. We\'re unable to move forward with this application at this time.'
        },
        capital: {
          'new': 'Hello {{1}}, your investment capital application for {{3}} has been received and is pending review. We will update you as soon as a decision is made.',
          'under review': 'Hello {{1}}, your investment capital application for {{3}} is now under review. We will contact you with the next steps.',
          'approved': 'Hello {{1}}, congratulations — your investment capital application for {{3}} has been approved in principle. We will contact you to discuss the investment and equity terms.',
          'rejected': 'Hello {{1}}, thank you for presenting {{3}} to G-Spirit. We are unable to proceed with this investment application at this time.'
        }
      };

      var template = templates[type] && templates[type][normalizedStatus];
      if (!template) {
        return 'Hello ' + name + ', your application status is now "' + (normalizedStatus || 'Updated') + '". We will contact you with more details soon.';
      }

      return template
        .replace('{{1}}', name)
        .replace('{{2}}', amountText)
        .replace('{{3}}', businessName);
    }

    function sendStatusWhatsApp(type, id) {
      var row = currentData.find(function (item) { return item.id === id; });
      if (!row) return;
      var templateType = type === 'loan' ? 'loan' : type === 'capital' ? 'capital' : 'partner';
      var status = normalizeStatus(row.status);
      var text = getWhatsAppTemplate(templateType, status, row);

      var phone = (row.phone || '').replace(/[^0-9+]/g, '');
      if (!phone) {
        alert('Applicant phone number is missing.');
        return;
      }
      if (phone.startsWith('0')) {
        phone = '237' + phone.slice(1);
      }
      var cleanPhone = phone.replace(/^\+/, '');
      var url = 'https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(text);
      window.open(url, '_blank');
    }

    function openAgreement(type, id) {
      var row = currentData.find(function (item) { return item.id === id; });
      if (!row) return;

      sessionStorage.setItem('agreementPrefill', JSON.stringify({ type: type, row: row }));

      var targetPage = type === 'loan' ? 'loanagreement.html' : 
                       type === 'capital' ? 'capitalagreement.html' : 
                       'partnership.html';
      window.open(targetPage, '_blank');
    }

    function renderLoans(rows) {
      if (!rows || rows.length === 0) {
        var hasSearch = document.getElementById('searchInput').value.trim() !== '';
        document.getElementById('tableWrap').innerHTML = '<div class="empty-state">' + (hasSearch ? 'No loan applications match that search.' : 'No loan applications yet.') + '</div>';
        return;
      }
      var html = '<table><thead><tr>' +
        '<th><input type="checkbox" id="selectAllBox" onclick="toggleSelectAll(this.checked)"></th>' +
        '<th>#</th><th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>DOB</th><th>Residence</th><th>Amount</th><th>Term</th><th>Purpose</th><th>Income</th><th>Employment</th><th>Surety Name</th><th>Surety Phone</th><th>Surety Address</th><th>Surety Relation</th><th>Collateral</th><th>Status</th><th>Action</th>' +
        '</tr></thead><tbody>';
      rows.forEach(function (r, index) {
        var checked = selectedIds[r.id] ? ' checked' : '';
        html += '<tr>' +
          '<td><input type="checkbox" class="row-select" onchange="toggleSelection(this, ' + r.id + ')"' + checked + '></td>' +
          '<td>' + (index + 1) + '</td>' +
          '<td>' + new Date(r.created_at).toLocaleDateString() + '</td>' +
          '<td>' + (r.name || '') + '</td>' +
          '<td>' + (r.phone || '') + '</td>' +
          '<td>' + (r.email || '') + '</td>' +
          '<td>' + (r.dob || '') + '</td>' +
          '<td>' + (r.residence || '') + '</td>' +
          '<td>' + Number(r.amount || 0).toLocaleString() + ' XAF</td>' +
          '<td>' + (r.term || '') + '</td>' +
          '<td>' + (r.purpose || '') + '</td>' +
          '<td>' + Number(r.income || 0).toLocaleString() + '</td>' +
          '<td>' + (r.employment || '') + '</td>' +
          '<td>' + (r.surety_name || '') + '</td>' +
          '<td>' + (r.surety_phone || '') + '</td>' +
          '<td>' + (r.surety_address || '') + '</td>' +
          '<td>' + (r.surety_relation || '') + '</td>' +
          '<td>' + (r.collateral || '') + '</td>' +
          '<td><select class="status-select ' + statusClass(r.status) + '" onchange="updateStatus(\'loan_applications\', ' + r.id + ', this)">' + statusOptions(r.status) + '</select></td>' +
          '<td>' + '<button class="whatsapp-btn" onclick="sendStatusWhatsApp(\'loan\', ' + r.id + ')">Send Status</button>' + (normalizeStatus(r.status) === 'approved' ? '<br><a href="#" class="agreement-btn" onclick="openAgreement(\'loan\', ' + r.id + '); return false;">Agreement</a>' : '') + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      document.getElementById('tableWrap').innerHTML = html;
      document.getElementById('selectAllBox').checked = currentFiltered.length > 0 && currentFiltered.every(function (r) { return selectedIds[r.id]; });
    }

    function renderPartners(rows) {
      if (!rows || rows.length === 0) {
        var hasSearch = document.getElementById('searchInput').value.trim() !== '';
        document.getElementById('tableWrap').innerHTML = '<div class="empty-state">' + (hasSearch ? 'No partnership applications match that search.' : 'No partnership applications yet.') + '</div>';
        return;
      }
      var html = '<table><thead><tr>' +
        '<th><input type="checkbox" id="selectAllBox" onclick="toggleSelectAll(this.checked)"></th>' +
        '<th>#</th><th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>DOB</th><th>Residence</th><th>Occupation</th><th>Shares</th><th>Contribution</th><th>Payout</th><th>Payment Method</th><th>Next of Kin</th><th>Reason</th><th>Status</th><th>Action</th>' +
        '</tr></thead><tbody>';
      rows.forEach(function (r, index) {
        var checked = selectedIds[r.id] ? ' checked' : '';
        html += '<tr>' +
          '<td><input type="checkbox" class="row-select" onchange="toggleSelection(this, ' + r.id + ')"' + checked + '></td>' +
          '<td>' + (index + 1) + '</td>' +
          '<td>' + new Date(r.created_at).toLocaleDateString() + '</td>' +
          '<td>' + (r.name || '') + '</td>' +
          '<td>' + (r.phone || '') + '</td>' +
          '<td>' + (r.email || '') + '</td>' +
          '<td>' + (r.dob || '') + '</td>' +
          '<td>' + (r.residence || '') + '</td>' +
          '<td>' + (r.occupation || '') + '</td>' +
          '<td>' + (r.shares || '') + '</td>' +
          '<td>' + Number(r.total_contribution || 0).toLocaleString() + ' XAF</td>' +
          '<td>' + (r.payout || '') + '</td>' +
          '<td>' + (r.payment_method || '') + '</td>' +
          '<td>' + (r.next_of_kin || '') + '</td>' +
          '<td>' + (r.reason || '') + '</td>' +
          '<td><select class="status-select ' + statusClass(r.status) + '" onchange="updateStatus(\'partnership_applications\', ' + r.id + ', this)">' + statusOptions(r.status) + '</select></td>' +
          '<td>' + '<button class="whatsapp-btn" onclick="sendStatusWhatsApp(\'partner\', ' + r.id + ')">Send Status</button>' + (normalizeStatus(r.status) === 'approved' ? '<br><a href="#" class="agreement-btn" onclick="openAgreement(\'partner\', ' + r.id + '); return false;">Agreement</a>' : '') + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      document.getElementById('tableWrap').innerHTML = html;
      document.getElementById('selectAllBox').checked = currentFiltered.length > 0 && currentFiltered.every(function (r) { return selectedIds[r.id]; });
    }

    function renderCapital(rows) {
      if (!rows || rows.length === 0) {
        var hasSearch = document.getElementById('searchInput').value.trim() !== '';
        document.getElementById('tableWrap').innerHTML =
          '<div class="empty-state">' +
          (hasSearch ? 'No investment capital applications match that search.' : 'No investment capital applications yet.') +
          '</div>';
        return;
      }

      var html = '<table><thead><tr>' +
        '<th><input type="checkbox" id="selectAllBox" onclick="toggleSelectAll(this.checked)"></th>' +
        '<th>#</th><th>Date</th><th>Applicant</th><th>Phone</th><th>Email</th>' +
        '<th>Business</th><th>Stage</th><th>Sector</th><th>Location</th>' +
        '<th>Capital Requested</th><th>Equity Offered</th><th>Revenue</th><th>Use of Capital</th>' +
        '<th>Registration</th><th>Status</th><th>Action</th></tr></thead><tbody>';

      rows.forEach(function (r, index) {
        var checked = selectedIds[r.id] ? ' checked' : '';
        html += '<tr>' +
          '<td><input type="checkbox" class="row-select" onchange="toggleSelection(this, ' + r.id + ')"' + checked + '></td>' +
          '<td>' + (index + 1) + '</td>' +
          '<td>' + new Date(r.created_at).toLocaleDateString() + '</td>' +
          '<td>' + (r.name || '') + '</td>' +
          '<td>' + (r.phone || '') + '</td>' +
          '<td>' + (r.email || '') + '</td>' +
          '<td>' + (r.business_name || '') + '</td>' +
          '<td>' + (r.business_stage || '') + '</td>' +
          '<td>' + (r.sector || '') + '</td>' +
          '<td>' + (r.location || '') + '</td>' +
          '<td>' + Number(r.capital_requested || 0).toLocaleString() + ' XAF</td>' +
          '<td>' + (r.equity_offered || '') + '</td>' +
          '<td>' + Number(r.monthly_revenue || 0).toLocaleString() + ' XAF</td>' +
          '<td>' + (r.capital_use || '') + '</td>' +
          '<td>' + (r.registration_status || '') + '</td>' +
          '<td><select class="status-select ' + statusClass(r.status) + '" onchange="updateStatus(\'capital_applications\', ' + r.id + ', this)">' + statusOptions(r.status) + '</select></td>' +
          '<td>' + 
            '<button class="whatsapp-btn" onclick="sendStatusWhatsApp(\'capital\', ' + r.id + ')">Send Status</button>' + 
            (normalizeStatus(r.status) === 'approved' ? '<br><a href="#" class="agreement-btn" onclick="openAgreement(\'capital\', ' + r.id + '); return false;">Agreement</a>' : '') + 
          '</td>' +
          '</tr>';
      });

      html += '</tbody></table>';
      document.getElementById('tableWrap').innerHTML = html;
      document.getElementById('selectAllBox').checked =
        currentFiltered.length > 0 && currentFiltered.every(function (r) { return selectedIds[r.id]; });
    }

    attachSidebarListeners();
    syncSidebarState();
    updateSidebarCounts({ loans: 0, partners: 0, capital: 0 });
    toggleSidebar(false);

    // Press Enter in the password field to log in.
    document.getElementById('tokenInput').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') login();
    });

    // Auto-login if a JWT is already stored for this browser session
    window.addEventListener('load', function () {
      var saved = sessionStorage.getItem('gspirit_admin_token');
      if (saved) {
        adminToken = saved;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        syncSidebarState();
        loadSidebarCounts();
        loadCurrentTab();
      }
    });
  </script>

</body>
</html>
